[project]
name = "p13"
version = "0.1.0"
description = "Photo-based fashion recommendation PoC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "rembg[cpu]>=2.0.57",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "gradio>=4.40.0",
    "requests>=2.31.0",
    "open-clip-torch>=3.3.0",
    "accelerate>=0.30.0",
    "tqdm>=4.66.0",
    "lpips>=0.1.4",
    "scikit-image>=0.21.0",
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "kaggle>=2.1.0",
    "pytest>=8.0.0",
    "ruff>=0.15.12",
]
